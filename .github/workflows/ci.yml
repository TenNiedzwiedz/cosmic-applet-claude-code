name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream clang libfontconfig-dev libfreetype-dev libinput-dev \
            libssl-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      # Cheap and independent of the Rust build, so it runs before the
      # toolchain is set up: broken metadata fails in seconds, not minutes.
      # --no-net matches `just validate-metainfo`; reachability of the <url>
      # tags is not this job's business.
      - name: Validate AppStream metadata
        run: |
          appstreamcli validate --no-net --explain \
            data/io.github.tenniedzwiedz.CosmicAppletClaudeCode.metainfo.xml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # native=true: the container image exists for local builds, CI already
      # runs on Ubuntu 24.04.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
