[package]
name = "cosmic-applet-claude-code"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet showing active Claude Code sessions and subscription usage limits"
repository = "https://github.com/TenNiedzwiedz/cosmic-applet-claude-code"
readme = "README.md"
rust-version = "1.85"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "511384f6206527cf87369da67a9164831afbabef", default-features = false, features = [
    "applet",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
